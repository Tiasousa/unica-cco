<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>
<title>Única Construtora — Centro de Controle Operacional</title>
<link rel="icon" href="assets/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCO Única">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>
<div class="login-tela">
<form
class="login-card"
id="formLogin"
autocomplete="off"
>
<img
src="assets/icon.png"
alt="Única Construtora"
class="login-logo"
>
<div class="login-titulo">
ÚNICA CONSTRUTORA
</div>
<div class="login-subtitulo">
Centro de Controle Operacional
</div>
<div class="login-form">
<div
class="login-erro"
id="loginErro"
>
E-mail ou senha incorretos.
</div>
<div class="campo">
<label for="email">
E-mail
</label>
<input
type="email"
id="email"
required
autocomplete="email"
placeholder="seuemail@unicaconstrutora.com"
>
</div>
<div class="campo">
<label for="senha">
Senha
</label>
<input
type="password"
id="senha"
required
autocomplete="current-password"
placeholder="••••••••"
>
</div>
<button
type="submit"
class="btn-entrar"
>
Entrar
</button>
</div>
<div class="login-rodape">
Acesso restrito · Uso interno
</div>
</form>
</div>
<script
type="module"
src="js/auth.js?v=16"
></script>
</body>
</html>
