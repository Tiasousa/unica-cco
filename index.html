<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Única Construtora — Centro de Controle Operacional</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

<div class="login-tela">
  <form class="login-card" id="formLogin" autocomplete="off">
    <img src="assets/icon.png" alt="Única Construtora" class="login-logo">
    <div class="login-titulo">ÚNICA CONSTRUTORA</div>
    <div class="login-subtitulo">Centro de Controle Operacional</div>

    <div class="login-form">
      <div class="login-erro" id="loginErro">E-mail ou senha incorretos.</div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seuemail@unicaconstrutora.com">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>
    </div>

    <div class="login-rodape">Acesso restrito · Uso interno</div>
  </form>
</div>

<script type="module" src="js/auth.js?v=4"></script>
</body>
</html>
